# Shared tmux defaults for agent sessions on Linux VMs (tmux 3.2+).
# Keep the standard Ctrl-b prefix and zero-based window/pane indexes.

# Leave jobs running when SSH disconnects or the last client detaches.
set -s exit-unattached off
set -g destroy-unattached off

# Preserve successful and failed jobs for inspection; restart explicitly with
# respawn-pane, or remove a completed pane with Ctrl-b x.
set -g remain-on-exit on
set -g history-limit 50000

# Give jobs started with new-session -d a usable terminal before anyone attaches.
set -g default-size 120x40
setw -g window-size latest

# Use the host's terminfo when available, with a fallback for minimal images.
set -g default-terminal "screen-256color"
if-shell 'command -v infocmp >/dev/null 2>&1 && infocmp tmux-256color >/dev/null 2>&1' 'set -g default-terminal "tmux-256color"'
set -s escape-time 50
set -g focus-events on

# Copy through the attached terminal (OSC 52), without a desktop clipboard tool.
# Leave mouse reporting off so terminal selection works normally over SSH.
set -s set-clipboard external
set -g mouse off
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# New shells start alongside the current pane's project.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Stable window names help scripts target jobs; retain explicit names from -n.
setw -g allow-rename off
set -g renumber-windows off

# Plain text and standard colours work with basic SSH terminals and fonts.
set -g status-style "bg=colour234,fg=colour250"
set -g status-left-length 60
set -g status-left " #h | #S "
set -g status-right-length 60
set -g status-right "#{?pane_dead,exit=#{pane_dead_status},#{pane_current_command}} | %Y-%m-%d %H:%M "
setw -g window-status-format " #I:#W#F "
setw -g window-status-current-format " #I:#W#F "
setw -g window-status-current-style "fg=colour234,bg=colour39,bold"

# Machine-specific preferences stay outside the portable config.
source-file -q ~/.tmux.conf.local
